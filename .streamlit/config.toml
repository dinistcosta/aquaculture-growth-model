# Tema da app (caderno científico: tinta sobre papel creme). Usado com "streamlit run app.py".
# O site (index.html) repete estes valores em streamlitConfig, mas aí a letra
# vai sem URL (com URL, o stlite fica em branco).
[theme]
base = "light"
primaryColor = "#1F5C66"
backgroundColor = "#F5F0E6"
secondaryBackgroundColor = "#EBE3D3"
textColor = "#22201C"
borderColor = "#D8CDB8"
showWidgetBorder = true
baseRadius = "0.25rem"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"

[client]
toolbarMode = "viewer"
